Write UPSC-specific informational content below the tool covering answer writing strategy, how to stay within limits, and the importance of practice.

SEO REQUIREMENTS FOR ALL PAGES
Every page must have a unique title and meta description. Every page must have a canonical link tag. Every page must have a robots meta tag set to index follow. Every tool page must have WebApplication schema markup. Every tool page must have FAQ schema markup. Every tool page must have a breadcrumb navigation. Every page must have geo targeting meta tags for India.

PERFORMANCE REQUIREMENTS
The site must achieve a Lighthouse Performance score of 95 or above. To achieve this: load Inter font with display=swap to prevent render blocking, use lazy loading for mammoth.js (only load when user uploads a .docx file), use textContent instead of innerHTML when updating stat values to prevent XSS and improve performance, debounce the keyword density calculation by 300ms, handle texts up to 50000 words without lag.

MOBILE REQUIREMENTS
The site must work perfectly on a 375px wide screen. The tool layout changes from two columns to single column on mobile. The stats grid changes from 4 columns to 2 columns. The textarea reduces to 200px minimum height. The navbar collapses to a hamburger menu. Platform checker cards become 1 column. All buttons must be large enough to tap comfortably.

PRIVACY REQUIREMENTS
No text is ever sent to any server. All analysis happens in the browser using JavaScript. No user account is required. No cookies are set for tracking. localStorage is used only for saving the user's own draft. Display a privacy badge prominently on all tool pages showing "100% Private — runs in your browser".

COMPETITOR GAPS TO FIX
The following problems exist on every competitor website. Make sure your implementation solves all of them:
wordcounter.net is loaded with distracting ads, has no word goal or progress bar, has not been updated since 2015, processes text on their servers, does not support file upload, and has poor mobile experience.
toolninja.in mentions UPSC in their text but never actually built the exam preset feature. Their design is outdated and cluttered. They have no autosave, no export options beyond copy, and their mobile layout is broken.
All competitors share these gaps: no word goal tracker with a visual progress bar, no Indian exam presets (UPSC 150, UPSC 250, CBSE, IELTS), no platform limits checker that updates live, no file upload support, no autosave, no writing session analytics, no export to Markdown, and no privacy-first messaging.


