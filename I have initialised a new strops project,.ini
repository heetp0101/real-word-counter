RealWordCounter — Build Instructions for Claude Code

PROJECT OVERVIEW
Build a multi-page writing tools website called RealWorldCounter using Astro JS. This will be ranked on Google in India. The goal is to outrank wordcounter.net, wordcounttool.com, and toolninja.in.
Target users: Indian students preparing for UPSC, CBSE, IELTS exams, plus bloggers, content creators, and freelance writers.

TECH STACK
	•	Framework: Astro JS (latest stable version, static output mode)
	•	Styling: Plain CSS with CSS custom properties — no Tailwind, no CSS frameworks
	•	JavaScript: Vanilla JS only — no React, no Vue, no other frameworks
	•	Fonts: Inter from Google Fonts
	•	Deployment target: Vercel (static)
	•	Install the @astrojs/sitemap integration for automatic sitemap generation

PROJECT FILE STRUCTURE
Create exactly this structure:


RealWordCounter/
├── astro.config.mjs
├── package.json
├── public/
│   ├── favicon.svg
│   └── robots.txt
└── src/
    ├── layouts/
    │   └── BaseLayout.astro
    ├── components/
    │   ├── Navbar.astro
    │   └── Footer.astro
    ├── styles/
    │   ├── global.css
    │   └── components.css
    └── pages/
        ├── index.astro
        ├── word-counter.astro
        └── upsc-word-counter.astro

ASTRO CONFIGURATION
In astro.config.mjs, set output to static and add the sitemap integration with the site URL set to https://realwordcounter.com. This ensures sitemap-index.xml and sitemap-0.xml are automatically generated on every build.

DESIGN SYSTEM
Define a complete set of CSS custom properties in global.css covering colors, typography, spacing, border radius, and shadows. The design should feel modern and clean — inspired by products like Linear and Vercel but simpler. Light mode is the default. Dark mode is optional and only activates when the user clicks a toggle button. Store the dark mode preference in localStorage.
The color palette should use a blue primary (#2563EB), green for success (#16A34A), amber for warnings (#D97706), and red for errors (#DC2626). Background should be a very light grey (#F9FAFB) with white cards. Text should use near-black (#111827) for headings and dark grey (#374151) for body text.
Typography uses Inter throughout. Headings should be bold with tight line heights. Body text should be 15px with 1.6 line height.

SHARED LAYOUT — BaseLayout.astro
Every page uses this layout. It accepts these props: title, description, canonical URL, and schema type (WebPage or WebApplication).
The layout head section must include:
	•	Unique title tag using the title prop
	•	Meta description using the description prop
	•	Canonical link tag
	•	Robots meta set to index follow
	•	Open Graph tags for title, description, URL, site name, and locale set to en_IN
	•	Twitter card tags
	•	Geo targeting meta tags for India (geo.region = IN)
	•	WebApplication schema markup as a JSON-LD script tag for tool pages
	•	Google Fonts preconnect links and the Inter font stylesheet
	•	Links to global.css and components.css
	•	A placeholder comment for Google Analytics (not implemented yet)
	•	A placeholder comment for Google AdSense (not implemented yet)
	•	A placeholder comment for Google Search Console verification
The layout body must include the Navbar component, a slot for page content, the Footer component, and an inline script that handles the dark mode toggle and the hamburger mobile menu.

NAVBAR COMPONENT
The navbar is sticky at the top with a white background, subtle bottom border, and a height of 60px. On desktop it shows the RealWordCounter logo on the left (with "Count" in the primary blue color), navigation links in the middle (Home, Word Counter, UPSC Counter, Platform Limits), and a privacy badge pill on the right that says "100% Private" in green, plus a dark mode toggle button.
On mobile below 768px, the navigation links collapse and a hamburger button appears. Tapping it reveals the nav links in a dropdown panel. The hamburger turns into an X when open.
Highlight the active page link based on the current URL path.

FOOTER COMPONENT
A dark footer (#111827 background) with three columns on desktop and single column on mobile. Left column has the logo, a brief description of RealWordCounter, and a privacy note. Middle column has links to all tools. Right column has links that will be added in later phases. The very bottom shows copyright and a "100% Private — No data stored" note.

ROBOTS.TXT
Allow all crawlers and include a line pointing to the sitemap URL at https://realwordcounter.com/sitemap-index.xml.

PAGE 1 — Homepage (index.astro)
SEO title: RealWordCounter — Free Word Counter and Writing Tools for India Meta description: Free writing tools for Indian students and creators. Word counter with goal tracker, UPSC and CBSE exam presets, platform limits checker. 100% private, no signup required.
Build these sections in order:
Hero section with a large H1 heading that says "Free Writing Tools That Help You Write Better", a subheading mentioning goal tracking, exam preparation, social media optimization, and privacy. Two call to action buttons — "Start Writing" linking to the word counter page and "Explore Tools" scrolling to the tools section. Below the buttons show four trust badges in a row: No Signup, No Data Stored, Works Offline, and 100% Private.
Tools directory section showing cards for each tool available. In Phase 1 show cards for Word Counter and UPSC Word Counter, with placeholders for future tools.
Why RealWordCounter section with four feature highlight cards explaining the Goal Tracker, Platform Limits Checker, Autosave, and Privacy advantages over competitors.
Privacy section with a prominent message about browser-based processing, no login, no server uploads, and offline capability.
FAQ section with five general questions about the platform using the details and summary HTML accordion pattern.

PAGE 2 — Word Counter (word-counter.astro)
This is the most important page. Build it with maximum care.
SEO title: Word Counter Online Free — Live Word Count, Character Count and Goal Tracker Meta description: Free online word counter with live stats, word goal tracker, UPSC and CBSE exam presets, and platform character limits checker. 100% private — your text never leaves your browser. No signup needed. Canonical: https://realwordcounter.com/word-counter Schema type: WebApplication
Add FAQ schema markup as a JSON-LD script with these five questions and answers:
	1	Is this word counter completely free? Answer: Yes, 100% free, no signup, no account needed.
	2	Is my text private? Answer: Text never leaves the browser, all processing happens on the user's device.
	3	How does the word goal tracker work? Answer: Click a preset or type a custom target, a live progress bar fills as you write.
	4	Can I use this for UPSC answer writing practice? Answer: Yes, select UPSC 150 for 10-mark answers or UPSC 250 for 15-mark answers.
	5	Does this work for Hindi and other Indian languages? Answer: Character count and paragraph count work for any language.
Add a breadcrumb navigation showing Home then Word Counter.
Page layout: Two columns on desktop. Left column takes 60% width and contains the textarea, action buttons, stats grid, readability card, case converter, and keyword density section. Right column takes 40% width and contains the Goal Tracker, Platform Limits Checker, Export Panel, and a Writing Session Analytics card. On mobile both columns stack to full width.
Textarea
Large textarea with minimum height 280px on desktop and 200px on mobile. Light background, blue border on focus, placeholder text saying "Start typing or paste your text here... Your draft is automatically saved." Below the textarea show a small autosave indicator that says "Draft auto-saved" with a pulsing green dot.
Action Buttons
A row of small secondary buttons below the textarea: Paste, Clear (confirm if text is longer than 50 words), Upload File (accepts .txt and .docx), and Copy Stats.
For file upload, handle .txt files using the FileReader API. Handle .docx files by lazily loading mammoth.js from the CDN (https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js) only when the user actually tries to upload a .docx file. Show toast notifications for success and error states.
Ad Zone 1
Place a designated ad zone div below the action buttons. Style it with a dashed border, light grey background, and a minimum height of 90px. Add an HTML comment saying this is where Google AdSense code goes after approval.
Stats Grid
Eight stat cards in a 4x2 grid on desktop and 2x4 on mobile. Each card shows a large bold number and a label below. The eight stats are: Words, Characters, Characters Without Spaces, Sentences, Paragraphs, Reading Time in minutes, Speaking Time in minutes, and Unique Words.
All stats must update live on every single keystroke using the textarea input event. Use this logic:
	•	Words: split by whitespace, filter empty strings
	•	Characters: text.length
	•	Characters without spaces: remove all whitespace then count
	•	Sentences: split by period, exclamation mark, and question mark, filter short fragments
	•	Paragraphs: split by double newline, minimum 1 if any text exists
	•	Reading time: word count divided by 200, rounded up
	•	Speaking time: word count divided by 130, rounded up
	•	Unique words: lowercase all words, remove punctuation, count unique values using a Set
Readability Score Card
A highlighted card below the stats grid that shows the Flesch Reading Ease score and grade level. Only show this when there are at least 10 words. Use the standard Flesch formula. Map scores to grade labels: 90-100 is Very Easy Grade 5, 70-89 is Easy Grade 6, 60-69 is Standard Grade 7-8, 50-59 is Fairly Difficult Grade 9-10, 30-49 is Difficult Grade 11-12, below 30 is Very Difficult College level. Show a colored badge next to the score.
UNIQUE FEATURE 1 — Word Goal Tracker
This is the most important differentiating feature. No competitor has it.
Show a card with a number input for the target word count and a row of quick preset buttons. The presets and their values are: UPSC 150 (150 words), UPSC 250 (250 words), UPSC Essay (1100 words), CBSE 500 (500 words), IELTS Task 1 (150 words), IELTS Task 2 (250 words), Blog 1500 (1500 words), and LinkedIn (300 words).
Clicking a preset sets the goal input value and marks that button as active with a blue background.
Below the presets show a progress bar that fills as the user writes toward their target. The bar color should change based on progress: light blue from 0-49%, solid blue from 50-79%, amber from 80-99%, green when exactly at goal, and red when over the limit.
Below the progress bar show a status message that changes based on progress:
	•	Empty: "Set a target and start writing"
	•	Under 50%: show current words, target, and words remaining
	•	50-79%: show current words, target, and percentage complete
	•	80-99%: show "Almost there!" with words remaining
	•	Exactly at goal: show a celebration message with a party emoji
	•	Over limit: show a warning with how many words over the limit
UNIQUE FEATURE 2 — Platform Limits Checker
A card showing ten platform character limit cards in a 2-column grid. The platforms and their limits are: Twitter/X (280), Instagram Post (2200), Instagram Bio (150), WhatsApp (65536), LinkedIn Post (3000), Meta Description (155), YouTube Title (100), YouTube Description (5000), SMS (160), and Facebook Post (63206).
Each platform card shows the platform icon emoji, name, current character count vs the limit, a thin mini progress bar, and a status indicator. The card turns green with a checkmark tick and "Fits" when within the limit. It turns red with a cross and "Over by X chars" when over. Empty state shows a neutral grey dash.
All platform cards must update live on every keystroke using the character count, not word count.
Text Case Converter
A card with seven buttons: UPPERCASE, lowercase, Title Case, Sentence case, Alternating Case, Remove Extra Spaces, and Reverse Text. Clicking any button transforms the textarea content immediately and shows a success toast notification.
Keyword Density
A card showing the top 10 most frequent words in the text, excluding a comprehensive list of English stop words. Show each keyword with its count and a proportional bar. Only show this section when there are more than 20 words. Use 300ms debounce on this calculation to avoid performance issues on long texts.
Writing Session Analytics
A card showing four metrics that update every second: WPM (words per minute), Session Time (formatted as minutes and seconds), Words This Session, and Goal Completion Percentage. Start tracking from when the user first types. All data is local and never sent anywhere.
Export Panel
A card with four export buttons: Copy Text (copies textarea content to clipboard), Download TXT (downloads as .txt file), Download Markdown (downloads as .md file with a header), and Print (opens a clean print window).
Ad Zone 2
Place a second designated ad zone in the right column below the export panel. Same styling as Ad Zone 1.
SEO Content Below the Tool
After the tool layout, add a full-width section with at least 400 words of real content:
	•	H2: How to Use This Word Counter (with practical instructions)
	•	H2: Who Uses RealWordCounter (four use case cards for students, bloggers, social media creators, and freelancers)
	•	H2: Frequently Asked Questions (the five FAQ items listed above, using details and summary accordions)
	•	H2: More Writing Tools (links to other tool pages)
Autosave Implementation
Use localStorage to save the textarea content and goal value every 1 second after the user stops typing (debounced). On page load, check localStorage for a saved draft and restore it automatically. Show "Draft restored" in the autosave indicator when restoring. Key name: RealWordCounter_draft.
Toast Notifications
Implement a toast notification system that shows small colored notifications in the bottom right corner. Green for success, red for errors, blue for info. Each toast auto-dismisses after 2 seconds with a fade out animation. Multiple toasts should stack.

